<style>
  :root{
    --mist:#e3e9ea; --ink:#1c2a2e; --ink-soft:#4d5f63; --sea:#1f6f78; --shu:#b8432a;
    --glass:rgba(248,251,251,.74); --glass-line:rgba(28,42,46,.12);
  }
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{background:var(--mist);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #gl.orbit{cursor:grab}

  .mast{position:fixed;left:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0 20px;pointer-events:none;display:grid;gap:4px}
  .kicker{margin:0;font-size:11px;letter-spacing:.28em;color:var(--ink-soft)}

  .meta{margin:4px 0 0;font-size:11.5px;letter-spacing:.08em;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}

  .hint.gone{opacity:0}
  .hint .sp{display:none}

  body.night .hint{background:rgba(20,30,44,.62);color:#dfe8ee}

    background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(20,40,45,.12);cursor:pointer;transition:background .6s,border-color .6s}

  .tod .ic{position:absolute;top:11px;width:20px;height:20px;transition:color .5s,opacity .5s}
  .tod .sun{left:11px;color:#e0892e;fill:currentColor;stroke:currentColor;stroke-width:1.8}

</div>

<script>
(() => {
'use strict';
const canvas = document.getElementById('gl');
const MOBILE = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth,innerHeight)<600;
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, powerPreference:'high-performance'});
if (!gl) {
  document.body.insertAdjacentHTML('beforeend','<div class="fallback">このブラウザでは WebGL2 が使えないため、箱庭を表示できません。<br>最新の Safari・Chrome でお試しください。</div>');
  return;
}

/* ---------------- math ---------------- */
const clamp=(x,a,b)=>x<a?a:x>b?b:x, mix=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function persp(fy,as,n,f){const t=1/Math.tan(fy/2);return new Float32Array([t/as,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]);}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function lookAt(e,c,u){const z=norm(sub(e,c)),x=norm(cross(u,z)),y=cross(z,x);return{m:new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]),x,y,z};}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}

/* ---------------- terrain (CPU) ---------------- */
function hash2(x,y){const h=Math.sin(x*127.1+y*311.7)*43758.5453123;return h-Math.floor(h);}
function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;}
function fbm(x,y,o=4){let s=0,a=.5,n=0;for(let i=0;i<o;i++){s+=a*noise(x,y);n+=a;x=x*2.03+1.7;y=y*2.03+9.2;a*=.5;}return s/n;}
function smax(a,b,k){const h=clamp(.5+.5*(b-a)/k,0,1);return mix(a,b,h)+k*h*(1-h);}
// cx, cz, sx, sz, top, seed
const ROCKS=[
  [-0.54,-0.52,0.25,0.20, 0.24,1],
  [-0.15,-0.60,0.10,0.09, 0.05,2],
  [-1.04, 0.40,0.32,0.44, 0.21,3],
  [ 0.46,-0.20,0.22,0.14,-0.075,4],
  [ 0.60, 0.38,0.085,0.07,0.03,5],
  [ 1.05,-0.38,0.20,0.42, 0.17,6],
  [ 0.05,-0.86,0.13,0.10,-0.13,7],
  [-0.30, 0.02,0.06,0.05,-0.05,8]
];
function rockH(x,z,R){const dx=(x-R[0])/R[2],dz=(z-R[1])/R[3];let r=Math.hypot(dx,dz);if(r>1.7)return -9;
  r+=(fbm(x*5+R[5]*7.3,z*5-R[5]*3.1)-.5)*.7;const p=clamp(1-r,0,1);const prof=Math.pow(p*p*(3-2*p),.55);
  const ridge=1-Math.abs(2*noise(x*11+R[5]*5,z*11)-1);return -0.46+(R[4]+0.46)*prof+(ridge-.5)*.05*prof;}
const TORII=[-0.47,-0.27,0.035];
function terrainAt(x,z){
  let s=(1-z)*.5+.075*Math.cos(x*1.7)-.02+(fbm(x*1.3+4,z*1.3)-.5)*.1; s=Math.max(s,0);
  let h=.15-.56*Math.pow(s,.78);
  h+=(fbm(x*4+11,z*4)-.5)*.03;
  h=Math.max(h,-.42+(fbm(x*2,z*2)-.5)*.05);
  let rk=-9;for(const R of ROCKS){const r=rockH(x,z,R);if(r>rk)rk=r;}
  let hh=smax(h,rk,.025), m=clamp((rk-h)/.02+.5,0,1);
  const td=Math.hypot(x-TORII[0],(z-TORII[1])/0.85), tw=1-smooth(0.085,0.15,td+(noise(x*14,z*14)-.5)*0.03);
  if(tw>0){hh=mix(hh,TORII[2]+(noise(x*40,z*40)-.5)*0.004,tw);m=Math.max(m,tw);}
  return [hh,m];
}
const TN=256, terrH=new Float32Array(TN*TN), terrData=new Float32Array(TN*TN*2);
for(let j=0;j<TN;j++)for(let i=0;i<TN;i++){const x=-1+(i+.5)*2/TN,z=-1+(j+.5)*2/TN;const t=terrainAt(x,z);const k=j*TN+i;terrH[k]=t[0];terrData[k*2]=t[0];terrData[k*2+1]=t[1];}
function terrAt(x,z){const u=clamp((x+1)*.5*TN-.5,0,TN-1.001),v=clamp((z+1)*.5*TN-.5,0,TN-1.001);const i=u|0,j=v|0,fx=u-i,fz=v-j,k=j*TN+i;
  return mix(mix(terrH[k],terrH[k+1],fx),mix(terrH[k+TN],terrH[k+TN+1],fx),fz);}

/* ---------------- wave simulation (CPU) ---------------- */
const N=160, DX=2/N, NN=N*N;
const H=new Float32Array(NN), V=new Float32Array(NN), FO=new Float32Array(NN), S=new Float32Array(NN), DMP=new Float32Array(NN), FG=new Float32Array(NN), WET=new Uint8Array(NN);
const simData=new Float32Array(NN*2);
const PERIOD=3.4, OMEGA=2*Math.PI/PERIOD, SWELL=0.0036;
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=j*N+i,x=-1+(i+.5)*DX,z=-1+(j+.5)*DX;const d=-terrAt(x,z);
  WET[k]=d>0.003?1:0; S[k]=0.85*clamp(d/0.3,0.05,1.15);
  const sh=1-smooth(0,0.07,d); DMP[k]=0.99965-0.035*Math.pow(sh,1.5); FG[k]=Math.pow(1-smooth(0,0.05,d),2);}
let simT=0;
function simStep(){
  simT+=1/120;
  // swell enters from the open-sea edge (z = -1)
  for(let i=0;i<N;i++){const x=-1+(i+.5)*DX;const k=i;if(!WET[k])continue;
    H[k]=SWELL*(0.8*Math.sin(OMEGA*simT)+0.38*Math.sin(OMEGA*1.31*simT+x*2.2)+0.18*Math.sin(OMEGA*0.73*simT-x*1.4));V[k]=0;}
  for(let j=0;j<N;j++){const row=j*N;for(let i=0;i<N;i++){const k=row+i;if(!WET[k])continue;const hc=H[k];
    const l=(i>0&&WET[k-1])?H[k-1]:hc, r=(i<N-1&&WET[k+1])?H[k+1]:hc, u=(j>0&&WET[k-N])?H[k-N]:hc, d=(j<N-1&&WET[k+N])?H[k+N]:hc;
    let v=(V[k]+((l+r+u+d)*.25-hc)*S[k])*DMP[k];V[k]=v;
    const f=FO[k]*0.986+FG[k]*Math.max(Math.abs(v)*480-0.04,0);FO[k]=f>1?1:f;}}
  for(let k=0;k<NN;k++){if(WET[k])H[k]+=V[k];else{H[k]=0;V[k]=0;}}
}
function disturb(x,z,rad,amt,foam){const ci=(x+1)/DX-.5,cj=(z+1)/DX-.5,rc=rad/DX,R=Math.ceil(rc*2);
  for(let j=Math.max(0,Math.floor(cj-R));j<=Math.min(N-1,Math.ceil(cj+R));j++)for(let i=Math.max(0,Math.floor(ci-R));i<=Math.min(N-1,Math.ceil(ci+R));i++){
    const k=j*N+i;if(!WET[k])continue;const d2=((i-ci)**2+(j-cj)**2)/(rc*rc);if(d2>4)continue;const w=Math.exp(-d2);V[k]+=amt*w;if(foam)FO[k]=Math.min(1,FO[k]+foam*w);}}
function simAt(x,z){const u=clamp((x+1)/DX-.5,0,N-1.001),v=clamp((z+1)/DX-.5,0,N-1.001);const i=u|0,j=v|0,fx=u-i,fz=v-j,k=j*N+i;
  return mix(mix(H[k],H[k+1],fx),mix(H[k+N],H[k+N+1],fx),fz);}

/* stir-flow field that carries the floats */
const FN=28, FX=new Float32Array(FN*FN), FZ=new Float32Array(FN*FN), TX=new Float32Array(FN*FN), TZ=new Float32Array(FN*FN);
function flowAdd(x,z,vx,vz){const ci=(x+1)/2*FN-.5,cj=(z+1)/2*FN-.5;for(let j=Math.max(0,Math.floor(cj-2));j<=Math.min(FN-1,Math.ceil(cj+2));j++)for(let i=Math.max(0,Math.floor(ci-2));i<=Math.min(FN-1,Math.ceil(ci+2));i++){
  const w=Math.exp(-((i-ci)**2+(j-cj)**2)/1.6)*.35,k=j*FN+i;FX[k]+=(vx-FX[k])*w;FZ[k]+=(vz-FZ[k])*w;}}
function flowStep(){for(let j=0;j<FN;j++)for(let i=0;i<FN;i++){const k=j*FN+i;let sx=0,sz=0,n=0;
  if(i>0){sx+=FX[k-1];sz+=FZ[k-1];n++;}if(i<FN-1){sx+=FX[k+1];sz+=FZ[k+1];n++;}if(j>0){sx+=FX[k-FN];sz+=FZ[k-FN];n++;}if(j<FN-1){sx+=FX[k+FN];sz+=FZ[k+FN];n++;}
  TX[k]=(FX[k]*.8+sx/n*.2)*.986;TZ[k]=(FZ[k]*.8+sz/n*.2)*.986;}FX.set(TX);FZ.set(TZ);}
function flowAt(x,z){const i=clamp(Math.round((x+1)/2*FN-.5),0,FN-1),j=clamp(Math.round((z+1)/2*FN-.5),0,FN-1);return[FX[j*FN+i],FZ[j*FN+i]];}

/* ---------------- glass floats (浮き玉) ---------------- */
const TINTS=[[0.22,0.62,0.46],[0.10,0.26,0.78],[0.80,0.46,0.10],[0.50,0.74,0.62],[0.28,0.52,0.70]];
const balls=[]; let tintIdx=0;
function ident(){return new Float32Array([1,0,0,0,1,0,0,0,1]);}
function addBall(x,z,y,air,vx=0,vz=0,vy=0){if(balls.length>=8)balls.shift();
  balls.push({x,z,y,vx,vz,vy,r:0.04,air,rot:ident(),tint:TINTS[tintIdx++%TINTS.length]});}
function rotate(b,ax,az,ang){ // rotate about horizontal axis (ax,0,az)
  const c=Math.cos(ang),s=Math.sin(ang),t=1-c,x=ax,y=0,z=az;
  const R=[t*x*x+c,t*x*y+s*z,t*x*z-s*y, t*x*y-s*z,t*y*y+c,t*y*z+s*x, t*x*z+s*y,t*y*z-s*x,t*z*z+c];
  const m=b.rot,o=new Float32Array(9);
  for(let col=0;col<3;col++)for(let row=0;row<3;row++){let v=0;for(let k=0;k<3;k++)v+=R[k*3+row]*m[col*3+k];o[col*3+row]=v;}
  b.rot=o;}
function ballsStep(dt){
  for(const b of balls){
    const wh=simAt(b.x,b.z),th=terrAt(b.x,b.z);
    if(b.air){b.vy-=2.4*dt;b.x+=b.vx*dt;b.z+=b.vz*dt;b.y+=b.vy*dt;
      b.x=clamp(b.x,-1+b.r,1-b.r);b.z=clamp(b.z,-1+b.r,1-b.r);
      const floor=Math.max(wh-b.r*.3,th+b.r);
      if(b.y<=floor){ if(wh>th+b.r*.5){disturb(b.x,b.z,0.035,Math.max(-0.006,b.vy*0.004),0.7);} b.air=false;b.y=floor;b.vy=0;b.vx*=.4;b.vz*=.4;}
      continue;}
    const e=0.02,gx=(simAt(b.x+e,b.z)-simAt(b.x-e,b.z))/(2*e),gz=(simAt(b.x,b.z+e)-simAt(b.x,b.z-e))/(2*e);
    const fl=flowAt(b.x,b.z);
    let ax=-gx*1.5+(fl[0]-b.vx)*1.1, az=-gz*1.5+(fl[1]-b.vz)*1.1+0.006;
    const depth=wh-th;
    if(depth<b.r*1.6){const tgx=(terrAt(b.x+e,b.z)-terrAt(b.x-e,b.z))/(2*e),tgz=(terrAt(b.x,b.z+e)-terrAt(b.x,b.z-e))/(2*e);
      const k=(1-clamp(depth/(b.r*1.6),0,1))*1.6;ax-=tgx*k;az-=tgz*k;b.vx*=.97;b.vz*=.97;}
    b.vx+=ax*dt;b.vz+=az*dt;
    const nx=b.x+b.vx*dt,nz=b.z+b.vz*dt;
    if(terrAt(nx,nz)>wh+b.r*.2){b.vx*=-.4;b.vz*=-.4;}else{b.x=nx;b.z=nz;}
    if(Math.abs(b.x)>1-b.r){b.x=Math.sign(b.x)*(1-b.r);b.vx*=-.5;}
    if(Math.abs(b.z)>1-b.r){b.z=Math.sign(b.z)*(1-b.r);b.vz*=-.5;}
    const target=Math.max(wh-b.r*.28,terrAt(b.x,b.z)+b.r);
    b.y+=(target-b.y)*Math.min(1,dt*9);
    const sp=Math.hypot(b.vx,b.vz);
    if(sp>1e-4){rotate(b,b.vz/sp,-b.vx/sp,sp*dt/b.r); if(sp>0.06)disturb(b.x,b.z,0.022,-sp*0.00018,0);}
  }
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],c=balls[j];if(a.air||c.air)continue;
    const dx=c.x-a.x,dz=c.z-a.z,d=Math.hypot(dx,dz),m=a.r+c.r;if(d>0&&d<m){const nx=dx/d,nz=dz/d,p=(m-d)*.5;a.x-=nx*p;a.z-=nz*p;c.x+=nx*p;c.z+=nz*p;
      const rv=(c.vx-a.vx)*nx+(c.vz-a.vz)*nz;if(rv<0){const im=-rv*.9;a.vx-=nx*im*.5;a.vz-=nz*im*.5;c.vx+=nx*im*.5;c.vz+=nz*im*.5;}}}
}


/* ---------------- GL helpers ---------------- */
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s),src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));throw new Error('shader');}return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return{p,u:{}};}

    if(hit&&simAt(hit[0],hit[1])>terrAt(hit[0],hit[1])+0.004)splash(hit[0],hit[1]);}
  if(ptrs.size===0){action=null;downInfo=null;}else{action='none';downInfo=null;}}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=clamp(cam.zoom*Math.exp(e.deltaY*0.001),0.4,1.8);},{passive:false});

/* ---------------- render ---------------- */
const ballU=new Float32Array(32),ballT=new Float32Array(24);
// night lights: 4 underwater floor lights, torii uplight, beach lantern glow
const LIGHTS=[[-0.36,-0.14,[0.35,0.95,1.0],0.020],[0.12,-0.34,[0.45,0.85,1.0],0.018],[0.30,0.06,[0.30,1.0,0.85],0.016],[-0.05,-0.72,[0.40,0.70,1.0],0.018]];
const LU=new Float32Array(24),LCU=new Float32Array(18);
LIGHTS.forEach((l,i)=>{LU.set([l[0],terrAt(l[0],l[1])+0.008,l[1],0],i*4);LCU.set(l[2],i*3);});
LU.set([-0.47,terrAt(-0.47,-0.22)+0.06,-0.19,0.012],16);LCU.set([1.0,0.62,0.30],12);
const LANTERNS=[[-0.42,0.80],[0.48,0.74]].map(([x,z])=>[x,terrAt(x,z)+0.03,z]);
LCU.set([1.0,0.7,0.4],15);

function commonU(PP,L){gl.useProgram(PP.p);
  gl.uniform1i(U(PP,'uTerr'),0);gl.uniform1i(U(PP,'uSim'),1);gl.uniform1i(U(PP,'uCaus'),2);
  gl.uniform1f(U(PP,'uTime'),simT);gl.uniform1f(U(PP,'uSwashAmp'),0.016);gl.uniform1f(U(PP,'uOmega'),OMEGA);gl.uniform1f(U(PP,'uWind'),L.wind||1.0);
  gl.uniform3fv(U(PP,'uSunDir'),L.sun);gl.uniform3fv(U(PP,'uSunCol'),L.sunCol);gl.uniform3fv(U(PP,'uSkyZen'),L.zen);gl.uniform3fv(U(PP,'uSkyHor'),L.hor);
  gl.uniform3fv(U(PP,'uAmb'),L.amb);gl.uniform3fv(U(PP,'uScat'),L.scat);gl.uniform3fv(U(PP,'uCam'),CS.e);
  gl.uniform4fv(U(PP,'uBalls'),ballU);gl.uniform3fv(U(PP,'uBallTint'),ballT);gl.uniform4fv(U(PP,'uL'),LU);gl.uniform3fv(U(PP,'uLC'),LCU);
  gl.uniform1f(U(PP,'uNight'),L.night);gl.uniform1f(U(PP,'uGlitter'),L.glitter);gl.uniform1f(U(PP,'uGlintK'),L.glintK);gl.uniform1i(U(PP,'uNB'),balls.length);gl.uniformMatrix4fv(U(PP,'uVP'),false,CS.vp);}
function draw(m){gl.bindVertexArray(m.a);gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0);}

// warm up so the swell has already reached the beach
for(let i=0;i<500;i++){simStep();simStep();flowStep();}

let prev=performance.now(),acc=0,ema=16,lastAdapt=prev;
function frame(now){
  const dt=Math.min((now-prev)/1000,0.1);prev=now;acc+=dt;let steps=0;
  while(acc>=1/60&&steps<3){simStep();simStep();flowStep();sprayStep(1/60);acc-=1/60;steps++;}if(steps===3)acc=0;
  ema=ema*0.95+dt*1000*0.05;
  if(now-lastAdapt>2500){lastAdapt=now;if(ema>26&&maxDpr>1){maxDpr=Math.max(1,maxDpr-0.25);resize();}}
  const kk=Math.min(1,dt*1.4);
  for(const key in cur){if(Array.isArray(cur[key]))cur[key]=lerp3(cur[key],target[key],kk);else cur[key]+=(target[key]-cur[key])*kk;}
  const L=Object.assign({},cur,{sun:norm(cur.sun)});

  for(let k=0;k<NN;k++){simData[k*2]=H[k];simData[k*2+1]=FO[k];}
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,texSim);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,N,N,gl.RG,gl.FLOAT,simData);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texTerr);
  ballU.fill(0);balls.forEach((b,i)=>{ballU[i*4]=b.x;ballU[i*4+1]=b.y;ballU[i*4+2]=b.z;ballU[i*4+3]=b.r;ballT.set(b.tint,i*3);});
  CS=camState();

  // caustics
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbCaus);gl.viewport(0,0,CR,CR);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  commonU(P.caus,L);draw(mCaus);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.bindTexture(gl.TEXTURE_2D,texCaus);

  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.msf);gl.viewport(0,0,RT.w,RT.h);
  gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);gl.depthMask(false);
  gl.useProgram(P.bg.p);gl.uniform3fv(U(P.bg,'uBgTop'),L.bgTop);gl.uniform3fv(U(P.bg,'uBgBot'),L.bgBot);gl.uniform1f(U(P.bg,'uNight'),L.night);gl.uniform1f(U(P.bg,'uT'),simT);gl.bindVertexArray(null);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ZERO,gl.ONE);commonU(P.shadow,L);draw(mQuad);gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.clear(gl.DEPTH_BUFFER_BIT);
  commonU(P.water,L);draw(mWater);
  commonU(P.terr,L);draw(mTerr);
  commonU(P.side,L);draw(mSide);
  commonU(P.wside,L);draw(mSide);
  commonU(P.solid,L);draw(mTorii);
  if(parts.length){let n=0;for(const p of parts){if(p.delay>0)continue;const o=n*6;PD[o]=p.x;PD[o+1]=p.y;PD[o+2]=p.z;PD[o+3]=p.s;PD[o+4]=p.k?Math.max(p.life,0):1;PD[o+5]=p.k;n++;}
    if(n){commonU(P.drop,L);gl.uniform1f(U(P.drop,'uPx'),RT.h/(2*Math.tan(fov/2)));
      gl.bindBuffer(gl.ARRAY_BUFFER,pBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,PD,0,n*6);
      gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ZERO,gl.ONE);gl.depthMask(false);
      gl.bindVertexArray(pVao);gl.drawArrays(gl.POINTS,0,n);gl.depthMask(true);gl.disable(gl.BLEND);}}
  commonU(P.ball,L);
  gl.uniform1f(U(P.ball,'uEmit'),0);
  for(const b of balls){gl.uniformMatrix3fv(U(P.ball,'uRot'),false,b.rot);gl.uniform4f(U(P.ball,'uBall'),b.x,b.y,b.z,b.r);gl.uniform3fv(U(P.ball,'uTint'),b.tint);draw(mBall);}
  // resolve MSAA, then star streaks from the glint mask
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,RT.msf);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,RT.scene.f);
  gl.blitFramebuffer(0,0,RT.w,RT.h,0,0,RT.w,RT.h,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,null);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.BLEND);gl.bindVertexArray(null);gl.activeTexture(gl.TEXTURE0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.a.f);gl.viewport(0,0,RT.hw,RT.hh);gl.useProgram(P.bright.p);gl.bindTexture(gl.TEXTURE_2D,RT.scene.t);
  gl.uniform1i(U(P.bright,'uSrc'),0);gl.uniform2f(U(P.bright,'uTexel'),1/RT.w,1/RT.h);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b.f);gl.useProgram(P.star.p);gl.bindTexture(gl.TEXTURE_2D,RT.a.t);
  gl.uniform1i(U(P.star,'uSrc'),0);gl.uniform2f(U(P.star,'uTexel'),1/RT.hw,1/RT.hh);gl.uniform1f(U(P.star,'uLen'),Math.max(1,dpr*(MOBILE?1.15:0.9)));gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(P.comp.p);
  gl.bindTexture(gl.TEXTURE_2D,RT.scene.t);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,RT.b.t);
  gl.uniform1i(U(P.comp,'uScene'),0);gl.uniform1i(U(P.comp,'uStar'),1);gl.uniform1f(U(P.comp,'uStarK'),L.star);
  gl.uniform3fv(U(P.comp,'uStarTint'),L.night>0.5?[0.85,0.92,1.1]:[1.05,0.97,0.85]);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.activeTexture(gl.TEXTURE0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
